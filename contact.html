<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Contact Maikrui Metal - Custom Hardware Inquiries</title>
    <meta name="description" content="Contact Maikrui Metal for custom metal hardware, OEM orders, and bulk pricing. Get professional service from our experienced sales team.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f8f8f8; color: #333; line-height: 1.6; padding-top: 70px; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex:1; padding: 4rem 0; background: #ffffff; }
        .container { width: 90%; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #0A244B; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #0A244B; }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #0A244B;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
        }
        .contact-info {
            text-align: center;
            margin-top: 2.5rem;
            padding: 1.5rem;
            background: #f8f8f8;
            border-radius: 8px;
            line-height: 2;
        }
        .contact-info h3 { margin-bottom: 0.8rem; color: #0A244B; }
        .email-link { color: #0A244B; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<!-- 自动加载顶部 -->
<div id="top"></div>

<!-- 联系页面内容（只有内容） -->
<section class="content">
    <div class="container">
        <h1>Get in Touch</h1>
        <form action="https://formsubmit.co/wiki458413539@gmail.com" method="POST">
            <label>Your Name</label>
            <input type="text" name="name" required>

            <label>Your Email</label>
            <input type="email" name="email" required>

            <label>Subject</label>
            <input type="text" name="subject" required placeholder="Belt Buckle / Hardware Inquiry">

            <label>Your Requirements</label>
            <textarea name="message" rows="5" required placeholder="quantity, design, material, finishing..."></textarea>

            <input type="hidden" name="_captcha" value="false">
            <button type="submit">Send Inquiry Now</button>
        </form>

        <div class="contact-info">
            <h3>Direct Contact</h3>
            <p>📩 Email: <a class="email-link" href="mailto:wiki458413539@gmail.com">Click to Send Email</a></p>
            <p>📱 WhatsApp: +86 15980009534</p>
            <p>📍 Location: Quanzhou, Fujian, China</p>
        </div>
    </div>
</section>

<!-- 自动加载底部 -->
<div id="bottom"></div>

<script>
    // 加载公共顶部 + 底部
    fetch("top.html").then(res=>res.text()).then(data=>{
        document.getElementById("top").innerHTML = data;
    });
    fetch("bottom.html").then(res=>res.text()).then(data=>{
        document.getElementById("bottom").innerHTML = data;
    });
</script>

</body>
</html>
