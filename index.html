<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maikrui Metal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}
        body{background:#f8f8f8;padding-top:70px;}
        .container{width:90%;max-width:1100px;margin:0 auto;}

        /* 轮播容器修改：使用aspect-ratio保证自适应比例，同时设置最小/最大高度 */
        .slider{
            position:relative;
            width:100%;
            /* 核心：用aspect-ratio替代固定height，保证宽高比自适应 */
            aspect-ratio: 16/9; 
            min-height: 280px; /* 移动端最小高度 */
            max-height: 600px; /* 电脑端最大高度 */
            background:#f8f8f8;
            overflow:hidden;
        }
        .slide-item{
            position:absolute;
            width:100%;
            height:100%;
            opacity:0;
            transition:opacity 1s ease;
            /* 关键：背景图片不平铺 + 覆盖容器 + 居中，保证自适应 */
            background-size: cover;    /* 覆盖容器，保持比例 */
            background-position: center; /* 居中显示 */
            background-repeat: no-repeat; /* 禁止平铺 */
        }
        .slide-item.active{opacity:1;}
        .slide-mask{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(10,36,75,0.35);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
            text-align:center;
            padding:0 20px;
        }
        .slide-mask h1{font-size:2.4rem;margin-bottom:1rem;text-shadow:1px 1px #000;}
        .prev,.next{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            font-size:2rem;
            color:#fff;
            background:none;
            border:none;
            cursor:pointer;
            z-index:10;
            padding:0 15px;
            /* 优化按钮点击区域 */
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prev{left:0;}.next{right:0;}

        .advantages{background:#fff;padding:4rem 0;text-align:center;}
        .section-title{font-size:1.8rem;margin-bottom:2rem;color:var(--brand-dark-blue);}
        .advantage-items{display:flex;flex-wrap:wrap;gap:2rem;justify-content:center;}
        .advantage{min-width:220px;}

        /* 响应式优化：不同屏幕尺寸微调轮播比例和文字大小 */
        @media (max-width:768px){
            .slider{
                aspect-ratio: 4/3; /* 移动端调整宽高比更适配 */
                max-height: 400px;
            }
            .slide-mask h1{font-size:1.4rem;}
            .prev, .next{
                font-size:1.5rem;
                width: 40px;
                height: 40px;
            }
        }
        /* 小屏手机额外适配 */
        @media (max-width:480px){
            .slider{
                min-height: 240px;
            }
            .slide-mask h1{font-size:1.2rem;}
        }
    </style>
</head>
<body>

<!-- 引入顶部 -->
<div id="top"></div>

<section class="slider">
    <div class="slide-item active" style="background-image:url(banner1.jpg)"><div class="slide-mask"><h1>Professional Die Casting Hardware Manufacturer</h1></div></div>
    <div class="slide-item" style="background-image:url(banner2.jpg)"><div class="slide-mask"><h1>OEM & ODM Custom Service</h1></div></div>
    <button class="prev" onclick="prevSlide()">&#10094;</button>
    <button class="next" onclick="nextSlide()">&#10095;</button>
</section>

<section class="advantages">
    <div class="container">
        <h2 class="section-title">Why Choose Us</h2>
        <div class="advantage-items">
            <div class="advantage"><h3>Factory Direct</h3><p>Competitive price</p></div>
            <div class="advantage"><h3>Custom Design</h3><p>OEM & ODM</p></div>
            <div class="advantage"><h3>Strict QC</h3><p>Quality guaranteed</p></div>
        </div>
    </div>
</section>

<!-- 引入底部 -->
<div id="bottom"></div>

<script>
    // 加载头部底部
    fetch('top.html').then(res=>res.text()).then(data=>document.getElementById('top').innerHTML=data);
    fetch('bottom.html').then(res=>res.text()).then(data=>document.getElementById('bottom').innerHTML=data);

    // 轮播图自动5秒切换
    let slides = document.querySelectorAll('.slide-item');
    let current = 0;
    let interval;

    function showSlide(index) {
        slides.forEach(s => s.classList.remove('active'));
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
    }

    function prevSlide() {
        showSlide(current - 1);
        resetAutoSlide();
    }

    function nextSlide() {
        showSlide(current + 1);
        resetAutoSlide();
    }

    function startAutoSlide() {
        interval = setInterval(nextSlide, 5000);
    }

    function resetAutoSlide() {
        clearInterval(interval);
        startAutoSlide();
    }

    // 页面加载后自动开始
    document.addEventListener('DOMContentLoaded', function() {
        showSlide(0);
        startAutoSlide();
    });
</script>

</body>
</html>
