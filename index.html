<section class="hero-slider">
    <div class="slider-wrapper">
        <div class="slide active" style="background-image: url('banner1.jpg');">
            <div class="slide-overlay">
                <div class="hero-content">
                    <h1>Professional Die Casting Hardware Manufacturer</h1>
                    <p>30+ years experience, custom belt buckles & garment hardware solutions.</p>
                </div>
            </div>
        </div>
        <div class="slide" style="background-image: url('banner2.jpg');">
            <div class="slide-overlay">
                <div class="hero-content">
                    <h1>Precision Metal Excellence</h1>
                    <p>High-quality zinc alloy die casting for global brands.</p>
                </div>
            </div>
        </div>
        </div>

    <button class="slider-prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="slider-next" onclick="changeSlide(1)">&#10095;</button>

    <div class="slider-dots">
        <span class="dot active" onclick="currentSlide(0)"></span>
        <span class="dot" onclick="currentSlide(1)"></span>
    </div>
</section>

<style>
    /* 轮播图样式修复 */
    .hero-slider {
        position: relative;
        height: 500px; /* 电脑端高度 */
        background: #eee;
        overflow: hidden;
    }
    .slider-wrapper { width: 100%; height: 100%; }
    .slide {
        position: absolute;
        width: 100%; height: 100%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .slide.active { opacity: 1; z-index: 1; }

    /* 遮罩层：让文字在任何背景图上都清晰 */
    .slide-overlay {
        width: 100%; height: 100%;
        background: rgba(0, 31, 63, 0.3); /* 你的Logo深蓝色半透明 */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .hero-content {
        text-align: center;
        color: white;
        padding: 0 20px;
        max-width: 800px;
    }
    .hero-content h1 {
        font-size: 2.5rem;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        margin-bottom: 15px;
    }
    .hero-content p {
        font-size: 1.2rem;
        text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }

    /* 箭头样式 */
    .slider-prev, .slider-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.3);
        color: white;
        border: none;
        padding: 15px 20px;
        cursor: pointer;
        z-index: 10;
        font-size: 20px;
        border-radius: 0 5px 5px 0;
    }
    .slider-next { right: 0; border-radius: 5px 0 0 5px; }
    .slider-prev:hover, .slider-next:hover { background: var(--maikrui-blue); }

    /* 小圆点 */
    .slider-dots {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }
    .dot {
        height: 12px; width: 12px;
        margin: 0 5px;
        background-color: rgba(255,255,255,0.5);
        border-radius: 50%;
        display: inline-block;
        cursor: pointer;
    }
    .dot.active { background-color: white; }

    /* 手机端适配：减小高度，缩小字体 */
    @media (max-width: 768px) {
        .hero-slider { height: 350px; }
        .hero-content h1 { font-size: 1.5rem; }
        .hero-content p { font-size: 0.9rem; }
    }
</style>

<script>
    let currentIdx = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    function showSlide(n) {
        slides.forEach(s => s.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));
        
        currentIdx = (n + slides.length) % slides.length;
        
        slides[currentIdx].classList.add('active');
        dots[currentIdx].classList.add('active');
    }

    function changeSlide(n) { showSlide(currentIdx + n); }
    function currentSlide(n) { showSlide(n); }

    // 自动播放
    setInterval(() => changeSlide(1), 5000);
</script>
