<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maikrui Workshop | Precision Hardware</title>
    <style>
        :root { --dark-blue: #001f3f; --silver: #e0e0e0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        header { background: var(--dark-blue); padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        /* Logo 适配：如果logo.png不存在，会显示文字 MAIKRUI */
        .logo-box { display: flex; align-items: center; text-decoration: none; color: white; font-weight: bold; }
        .logo-box img { height: 45px; width: auto; margin-right: 10px; filter: brightness(0) invert(1); }
        
        nav a { color: var(--silver); text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; text-transform: uppercase; }

        .slider-container { position: relative; height: 500px; width: 100%; overflow: hidden; background: #001f3f; }
        .slide { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; transition: opacity 1s ease-in-out;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
        }
        .slide.active { opacity: 1; }
        /* 遮罩层，防止图片太亮看不清字 */
        .slide::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        
        .hero-content { position: relative; z-index: 2; color: var(--white); text-align: center; }
        .hero-content h1 { font-size: 40px; text-transform: uppercase; }

        .features { padding: 60px 0; background: #f4f4f4; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { flex: 1; min-width: 300px; background: white; padding: 30px; border-top: 5px solid var(--dark-blue); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="index.html" class="logo-box">
            <img src="logo.png" onerror="this.style.display='none'">
            <span>MAIKRUI</span>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="slider-container">
    <div class="slide active" style="background-image: url('banner1.jpg');">
        <div class="hero-content"><h1>Precision Hardware</h1></div>
    </div>
    <div class="slide" style="background-image: url('banner2.jpg');">
        <div class="hero-content"><h1>Custom Die Casting</h1></div>
    </div>
    <div class="slide" style="background-image: url('banner3.jpg');">
        <div class="hero-content"><h1>Global Shipping</h1></div>
    </div>
</section>

<section class="features">
    <div class="container" style="flex-direction: column;">
        <div class="grid">
            <div class="card"><h3>Quality Control</h3><p>Strict testing for every buckle.</p></div>
            <div class="card"><h3>Fast Lead Time</h3><p>Reliable production for global clients.</p></div>
        </div>
    </div>
</section>

<script>
    let slides = document.querySelectorAll('.slide');
    let current = 0;
    function next() {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }
    // 每3秒换一张图
    setInterval(next, 3000);
</script>

</body>
</html>
