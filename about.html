<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Maikrui Metal</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}
        body{padding-top:80px;}

        header{background:var(--brand-dark-blue);height:80px;line-height:80px;padding:0;position:fixed;top:0;left:0;width:100%;z-index:9999;overflow:hidden;}
        .container{width:90%;max-width:1100px;margin:0 auto;height:100%;}
        .header-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:1rem;height:100%;}
        .logo{font-size:1.5rem;font-weight:bold;color:var(--brand-silver);display:flex;align-items:center;gap:8px;white-space:nowrap;height:100%;}
        .logo img{height:40px;width:auto;display:block;}
        nav{display:flex;gap:1.2rem;height:100%;align-items:center;flex-wrap:nowrap;}
        nav a{color:#ccc;text-decoration:none;transition:0.3s;white-space:nowrap;font-size:1rem;width:80px;text-align:center;line-height:normal;}
        nav a:hover{color:var(--brand-silver);}
        nav a.active{color:#fff;font-weight:bold;}

        .content{padding:60px 0;text-align:center;}

        footer{background:var(--brand-dark-blue);color:var(--brand-silver);text-align:center;padding:2rem 1rem;margin-top:3rem;}
        .whatsapp-btn{position:fixed;right:16px;bottom:20px;background:#25D366;color:#fff;padding:10px 14px;border-radius:50px;text-decoration:none;font-size:14px;z-index:99;cursor:move;user-select:none;}

        @media(max-width:768px){
            header{height:auto;padding:12px 0;}
            .header-inner{flex-direction:row;justify-content:space-between;flex-wrap:nowrap;}
            .logo{font-size:1rem;}
            .logo img{height:32px;}
            nav{gap:0.5rem;}
            nav a{width:auto;padding:0 2px;font-size:12px;}
            .content{padding:30px 15px;}
        }
    </style>
</head>
<body>

<header>
    <div class="container header-inner">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Maikrui Metal
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html" class="active">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<div class="content container">
    <h1>About Us</h1>
</div>

<footer>
    <div class="container">
        <p>Maikrui Metal © All Rights Reserved</p>
        <p>Email: contact@maikrui.com</p>
    </div>
</footer>

<a href="https://api.whatsapp.com/send?phone=861598009534" class="whatsapp-btn" id="wa">WhatsApp Us</a>

<script>
const btn=document.getElementById("wa");let isDrag=!1,ox,oy;
btn.addEventListener("mousedown",e=>{isDrag=!0;const r=btn.getBoundingClientRect();ox=e.clientX-r.left,oy=e.clientY-r.top;});
document.addEventListener("mousemove",e=>{isDrag&&(btn.style.right="auto",btn.style.bottom="auto",btn.style.left=e.clientX-ox+"px",btn.style.top=e.clientY-oy+"px");});
document.addEventListener("mouseup",()=>{isDrag=!1;});
</script>
</body>
</html>
