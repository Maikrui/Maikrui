<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}

    header{
        background:var(--brand-dark-blue);
        height:80px;
        line-height:80px;
        padding:0;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        z-index:9999;
        overflow:hidden;
    }
    .container{
        width:90%;
        max-width:1100px;
        margin:0 auto;
        height:100%;
    }
    .header-inner{
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:nowrap;
        gap:1rem;
        height:100%;
    }
    .logo{
        font-size:1.5rem;
        font-weight:bold;
        color:var(--brand-silver);
        display:flex;
        align-items:center;
        gap:8px;
        white-space:nowrap;
        height:100%;
    }
    .logo img{
        height:40px;
        width:auto;
        display:block;
    }
    nav{
        display:flex;
        gap:1.2rem;
        height:100%;
        align-items:center;
        flex-wrap:nowrap;
    }
    nav a{
        color:#ccc;
        text-decoration:none;
        transition:0.3s;
        white-space:nowrap;
        font-size:1rem;
        width:80px;
        text-align:center;
        line-height:normal;
    }
    nav a:hover{color:var(--brand-silver);}
    nav a.active{
        color:#fff;
        font-weight:bold;
    }

    @media(max-width:768px){
        header{height:auto; padding:12px 0;}
        .header-inner{
            flex-direction:row;
            justify-content:space-between;
            flex-wrap:nowrap;
        }
        .logo{font-size:1rem;}
        .logo img{height:32px;}
        nav{gap:0.5rem;}
        nav a{
            width:auto;
            padding:0 2px;
            font-size:12px;
        }
    }
</style>

<header>
    <div class="container header-inner">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Maikrui Metal
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<script>
window.addEventListener('DOMContentLoaded', function(){
    const current = window.location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll("nav a").forEach(a => {
        a.classList.remove("active");
        if(a.getAttribute("href") === current) a.classList.add("active");
    });
});
</script>
