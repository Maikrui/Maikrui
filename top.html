<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}

    header{
        background:var(--brand-dark-blue);
        height: 80px;
        line-height: 80px;
        padding: 0;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        z-index:999;
        overflow: hidden;
    }
    .container{
        width:90%;
        max-width:1100px;
        margin:0 auto;
        height: 100%;
    }
    .header-inner{
        display:flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: nowrap; /* 永远不换行 */
        gap: 1rem;
        height: 100%;
    }

    .logo{
        font-size:1.5rem;
        font-weight:bold;
        color:var(--brand-silver);
        display:flex;
        align-items: center;
        gap:8px;
        white-space:nowrap;
        height: 100%;
        line-height: 80px;
    }
    .logo img{
        height:40px;
        width:auto;
        vertical-align: middle;
    }

    nav{
        display:flex;
        gap:1.2rem;
        height: 100%;
        align-items: center;
        flex-wrap: nowrap; /* 导航永远一行 */
    }
    nav a{
        color:#ccc;
        text-decoration:none;
        transition:0.3s;
        white-space:nowrap;
        font-size:1rem;
        display: inline-block;
        width: 80px;
        text-align: center;
        line-height: normal;
    }
    nav a:hover{color:var(--brand-silver);}
    nav a.active{
        color:#fff;
        font-weight:bold;
    }

    /* 手机端 —— 只做一件事：保持一行，不堆叠 */
    @media(max-width:768px){
        header{
            height: 80px; /* 保持高度不变 */
        }
        .header-inner{
            flex-direction:row; /* 横向一行，不竖过来 */
            flex-wrap:nowrap;
            justify-content:space-between;
        }
        .logo{
            line-height: normal;
        }
        nav{
            flex-wrap:nowrap;
            gap:0.5rem;
        }
        nav a{
            width: auto;
            padding:0 3px;
            font-size:12px;
        }
    }
</style>

<header>
    <div class="container header-inner">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Maikrui Metal
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<script>
window.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split("/").pop() || 'index.html';
    const navLinks = document.querySelectorAll("nav a");
    navLinks.forEach(link => {
        link.classList.remove("active");
        if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
        }
    });
});
</script>
