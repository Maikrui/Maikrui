<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}

    header{
        background:var(--brand-dark-blue);
        height: 80px;
        line-height: 80px;
        padding: 0;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        z-index:999;
        overflow: hidden;
    }
    .container{
        width:90%;
        max-width:1100px;
        margin:0 auto;
        height: 100%;
    }
    .header-inner{
        display:flex;
        /* ↓ 这里改成居中对称，你要的效果 */
        justify-content: space-between;
        align-items: center;
        /* ↓ 强制永远不换行，保证四个选项一行 */
        flex-wrap: nowrap !important;
        gap: 1rem;
        height: 100%;
    }

    .logo{
        font-size:1.5rem;
        font-weight:bold;
        color:var(--brand-silver);
        display:flex;
        align-items: center;
        gap:8px;
        white-space:nowrap;
        height: 100%;
        line-height: 80px;
    }
    .logo img{
        height:40px;
        width:auto;
        vertical-align: middle;
    }

    nav{
        display:flex;
        gap:1.2rem;
        height: 100%;
        align-items: center;
        /* ↓ 强制导航永远一行 */
        flex-wrap: nowrap !important;
    }
    nav a{
        color:#ccc;
        text-decoration:none;
        transition:0.3s;
        white-space:nowrap;
        font-size:1rem;
        display: inline-block;
        width: 80px;
        text-align: center;
        line-height: normal;
    }
    nav a:hover{color:var(--brand-silver);}
    nav a.active{
        color:#fff;
        font-weight:bold;
    }

    /* 手机自适应 —— 永远一行、对称居中 */
    @media(max-width:768px){
        header{
            height: auto;
            line-height: normal;
            padding: 1rem 0;
        }
        .header-inner{
            /* ↓ 手机也保持一行，左右对称，不居中堆叠 */
            flex-direction: row !important;
            justify-content: space-between !important;
            text-align:left;
            gap:0.8rem;
            height: auto;
            flex-wrap: nowrap !important;
        }
        .logo{
            height: auto;
            line-height: normal;
        }
        .logo span {
            display:none; /* 手机只显示LOGO，不显示文字，保证导航有位置 */
        }
        nav{
            gap:0.6rem;
            /* ↓ 手机端永远一行，不换行 */
            flex-wrap: nowrap !important;
            justify-content:flex-end;
            height: auto;
        }
        nav a{
            font-size:0.9rem;
            width: auto !important;
            padding:0 4px;
        }
    }
</style>

<header>
    <div class="container header-inner">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Maikrui Metal
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<script>
window.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split("/").pop() || 'index.html';
    const navLinks = document.querySelectorAll("nav a");
    navLinks.forEach(link => {
        link.classList.remove("active");
        if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
        }
    });
});
</script>
