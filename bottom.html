<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    :root{--brand-dark-blue:#0A244B;--brand-silver:#E0E0E0;}

    /* 强制让 footer 永远在页面底部 */
    html, body {
        height: 100%;
        margin: 0;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    .container{
        width:90%;
        max-width:1100px;
        margin:0 auto;
    }

    footer{
        background:var(--brand-dark-blue);
        color:var(--brand-silver);
        text-align:center;
        padding:2rem 1rem;
        margin-top: auto; /* 核心：推到底部 */
        width: 100%;
    }
    footer p{
        margin:6px 0;
        font-size:1rem;
    }

    .whatsapp-btn{
        position:fixed;
        right:16px;
        bottom:20px;
        background:#25D366;
        color:#fff;
        padding:10px 14px;
        border-radius:50px;
        text-decoration:none;
        font-size:14px;
        z-index:99;
        cursor:move;
    }

    @media(max-width:768px){
        footer p{font-size:0.9rem;}
    }
</style>

<footer>
    <div class="container">
        <p>Maikrui Metal © All Rights Reserved</p>
        <p>Email: contact@maikrui.com</p>
    </div>
</footer>

<a href="https://api.whatsapp.com/send?phone=8615980009534" class="whatsapp-btn" id="wa">WhatsApp Us</a>

<script>
let btn=document.getElementById("wa");
let isDrag=false,ox=0,oy=0;

btn.addEventListener("mousedown",start);
document.addEventListener("mousemove",move);
document.addEventListener("mouseup",end);

function start(e){
    isDrag=true;
    ox=e.clientX-btn.offsetLeft;
    oy=e.clientY-btn.offsetTop;
}
function move(e){
    if(!isDrag) return;
    btn.style.right="auto";
    btn.style.bottom="auto";
    btn.style.left=e.clientX-ox+"px";
    btn.style.top=e.clientY-oy+"px";
}
function end(){
    isDrag=false;
}
</script>
