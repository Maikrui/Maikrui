<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Products | Maikrui Metal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body { background:#f8f8f8; color:#333; line-height:1.6; padding-top:65px; }

:root{
  --brand-dark-blue:#0A244B;
  --brand-silver:#E0E0E0;
  --active-color:#0A244B;
  --brand-text-dark:#0A244B;
}

/* 顶部导航 完全原封不动 */
header {
  background:var(--brand-dark-blue);
  padding:1rem 0;
  position:fixed;
  top:0; left:0; width:100%;
  z-index:100;
}
.container {
  width:90%; max-width:1100px; margin:0 auto;
}
.header-inner {
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;
}
.logo {
  font-size:1.5rem; font-weight:bold; color:var(--brand-silver);
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.logo img {
  background:transparent !important; border:none !important; outline:none !important;
  box-shadow:none !important; filter:none !important; padding:0 !important; margin:0 !important;
  height:40px !important; width:auto !important;
}
nav a {
  color:#ccc; text-decoration:none; margin-left:1.5rem;
  transition:color 0.3s ease; white-space:nowrap;
}
nav a:hover { color:var(--brand-silver); }

@media (max-width:768px) {
  nav a { margin-left:0.8rem; }
}

/* 原有样式 完全不动 */
.page-wrap{ display:flex; gap:2rem; padding:1rem 0 2rem; }
.side-left{
  width:230px; background:#fff; padding:1rem; border-radius:6px;
  border:1px solid #eee; height:fit-content;
}
.side-left ul{ list-style:none; }
.side-left .cate-title{
  font-weight:bold; padding:0.6rem 0.5rem; background:#f6f6f6;
  border-radius:4px; margin:0.8rem 0 0.4rem;
}
.side-left .cate-link{
  display:block; padding:0.6rem; border-radius:4px;
  color:#333; cursor:pointer; margin:0.2rem 0;
}
.side-left .cate-link.active{
  background:var(--active-color); color:#fff;
}
.main-content{
  flex:1; background:#fff; padding:2rem; border-radius:8px;
}
h1{ margin-bottom:1.8rem; color:var(--active-color); font-size:24px; }
.product{
  margin-bottom:3rem; padding-bottom:2rem; border-bottom:1px solid #eee;
}
.product:last-child{ margin-bottom:0; padding-bottom:0; border:none; }
.product-row{
  display:grid; grid-template-columns:1fr 1.4fr; gap:2rem; align-items:center;
}
.product-text h2{ font-size:20px; margin-bottom:0.6rem; color:var(--active-color); }
.product-text p{ font-size:14px; color:#555; line-height:1.5; }
.product-img{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.img-big{ grid-column:1/-1; height:260px; }
.img-sm{ height:160px; }
.product-img div{ border:1px solid #eee; border-radius:6px; overflow:hidden; background:#fff; }
.product-img img{ 
  width:100%; height:100%; object-fit:contain; cursor:pointer; 
  user-select:none; border-radius:4px; transition: transform 0.2s ease;
}
.product-img img:hover {
  transform: scale(1.05);
}

.lightbox{
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:999;
}
.lightbox.show{ display:flex; }
.lightbox img{ max-width:90%; max-height:90%; }
.lightbox .close{
  position:absolute; top:20px; right:30px; color:#fff; font-size:36px; cursor:pointer;
}

footer{
  background:var(--active-color); color:#fff; text-align:center; padding:2rem 0; margin-top:2rem;
}

/* 优化的手机端折叠按钮样式 */
.mobile-nav-btn {
  display: none;
  width: 100%;
  padding: 12px 15px;
  background: #fff;
  border: 2px solid var(--brand-dark-blue);
  border-radius: 6px;
  font-size: 16px;
  color: var(--brand-dark-blue);
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  margin: 10px 0;
  user-select: none;
  box-shadow: 0 2px 6px rgb(10 36 75 / 0.15);
  transition: background-color 0.3s ease, color 0.3s ease;
}
.mobile-nav-btn:hover, .mobile-nav-btn:focus {
  background-color: var(--brand-dark-blue);
  color: #fff;
  outline: none;
}

@media (max-width:768px) {
  .mobile-nav-btn {
    display: block;
  }
  .side-left {
    width: 100%;
    display: none;
    padding: 0.6rem 0.8rem;
    margin-bottom: 1rem;
    border: none;
    background: #f9f9f9;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.3;
    transition: max-height 0.4s ease;
    overflow: hidden;
    max-height: 0;
  }
  .side-left.open {
    display: block;
    max-height: 500px; /* 设定展开最大高度，方便动画 */
  }
  /* 紧凑字体和间距 */
  .side-left .cate-title {
    font-size: 14px;
    padding: 0.3rem 0.4rem;
    font-weight: 700;
    border-bottom: 1px solid #ddd;
    margin-top: 0.6rem;
  }
  .side-left .cate-link {
    font-size: 13px;
    padding: 0.35rem 0.5rem;
    margin: 0.15rem 0;
    border-radius: 4px;
    display: inline-block;
    width: 100%;
    box-sizing: border-box;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.3s ease;
  }
  .side-left .cate-link.active {
    background: var(--active-color);
    color: #fff;
  }

  .page-wrap {
    flex-direction: column;
    gap: 1rem;
  }
  .main-content {
    padding: 1rem 0.5rem;
  }
  .product-row {
    grid-template-columns: 1fr;
    gap: 1rem;
  }
}
</style>
</head>
